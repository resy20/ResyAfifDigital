<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan 3D Zoom Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bingkai utama (Simulasi Layar HP) */
        .parallax-container {
            position: relative;
            width: 100%;
            max-width: 412px;
            height: 90vh;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
        }

        /* Pengaturan dasar elemen transisi */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
            will-change: transform, opacity;
        }

        /* 1. KONTEN AWAL: KARAKTER PENGANTIN & TOMBOL BUKA */
        .layer-front {
            z-index: 3;
            flex-direction: column;
        }
        .dummy-avatar {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #ff80ab 0%, #ff4081 100%);
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(255,64,129,0.3);
            margin-bottom: 30px;
        }
        .btn-start {
            padding: 12px 28px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* 2. KONTEN KEDUA: SURAT UNDANGAN (Sembunyi di awal) */
        .layer-envelope {
            z-index: 2;
            opacity: 0;
            transform: scale(0.2); /* Di awal ukurannya sangat kecil di belakang */
        }
        .envelope {
            width: 180px;
            height: 130px;
            background-color: #ffb74d;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }
        /* Segitiga Tutup Surat */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-top: 65px solid #f57c00;
            border-radius: 8px 8px 0 0;
        }

        /* 3. POP-UP DETAIL ISI UNDANGAN ASLI */
        .invitation-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            transform: translateY(100%); /* Muncul slide-up dari bawah */
        }
        .invitation-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .invitation-modal h1 {
            font-family: 'Georgia', serif;
            color: #ff4081;
            margin-bottom: 20px;
        }
        .btn-close {
            margin-top: 30px;
            padding: 10px 20px;
            background: #374151;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* --- LOGIKA ANIMASI ZOOM IN SAAT TOMBOL DIKLIK --- */
        
        /* Karakter utama membesar parah (efek kamera menembus objek) & menghilang */
        .state-zoom .layer-front {
            transform: scale(4);
            opacity: 0;
            pointer-events: none;
        }

        /* Surat dari belakang maju ke depan dan ukurannya normal */
        .state-zoom .layer-envelope {
            transform: scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="parallax-container" id="mainContainer">
        
        <div class="layer layer-front">
            <div class="dummy-avatar"></div>
            <button class="btn-start" id="btnBuka">Lihat Undangan</button>
        </div>

        <div class="layer layer-envelope">
            <div class="envelope" id="btnSurat">KLIK SURAT</div>
        </div>

        <div class="invitation-modal" id="modalUndangan">
            <h1>The Wedding of</h1>
            <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">Romeo & Juliet</p>
            <p>Sabtu, 12 Desember 2026</p>
            <p>Gedung Kebahagiaan, Bandung</p>
            <button class="btn-close" id="btnTutup">Kembali ke Awal</button>
        </div>

    </div>

    <script>
        const mainContainer = document.getElementById('mainContainer');
        const btnBuka = document.getElementById('btnBuka');
        const btnSurat = document.getElementById('btnSurat');
        const modalUndangan = document.getElementById('modalUndangan');
        const btnTutup = document.getElementById('btnTutup');

        // Alur 1: Klik tombol pertama -> Efek Zoom In otomatis langsung jalan
        btnBuka.addEventListener('click', () => {
            mainContainer.classList.add('state-zoom');
        });

        // Alur 2: Klik Surat -> Membuka lembar isi undangan pernikahan
        btnSurat.addEventListener('click', () => {
            modalUndangan.classList.add('active');
        });

        // Alur 3: Klik Tutup -> Reset semua kembali ke tampilan paling awal
        btnTutup.addEventListener('click', () => {
            modalUndangan.classList.remove('active');
            mainContainer.classList.remove('state-zoom');
        });
    </script>
</body>
</html>

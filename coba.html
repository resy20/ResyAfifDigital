<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll & Touch Zoom Wedding Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Mengunci scroll bawaan browser agar kontrol penuh di JS */
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Simulasi Layar */
        .parallax-container {
            position: relative;
            width: 100%;
            max-width: 412px;
            height: 90vh;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
            touch-action: none; /* Mencegah refresh halaman bawaan HP saat di-swipe */
        }

        /* Base style untuk semua elemen yang bisa membesar/mengecil */
        .zoom-element {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            will-change: transform, opacity;
        }

        /* 1. LAYER UTAMA: KARAKTER PENGANTIN */
        .character-layer {
            z-index: 2;
        }
        .dummy-avatar {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #ff80ab 0%, #ff4081 100%);
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(255,64,129,0.3);
        }

        /* Petunjuk Awal di Layar */
        .scroll-hint {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            z-index: 5;
            color: #374151;
            font-weight: 600;
            animation: bounce 1.5s infinite;
        }

        /* 2. LAYER KEDUA: SURAT TERTUTUP (Muncul dari kecil saat di-scroll) */
        .envelope-layer {
            z-index: 3;
            opacity: 0;
            transform: scale(0.1);
            pointer-events: none;
        }
        .envelope {
            width: 150px;
            height: 110px;
            background-color: #ffb74d;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .envelope:hover {
            background-color: #ffa726;
        }
        /* Segitiga tutup surat */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-top: 55px solid #f57c00;
            border-radius: 8px 8px 0 0;
        }

        /* 3. MODAL / POP-UP ISI UNDANGAN ASLI (Muncul setelah surat diklik) */
        .invitation-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(100px); /* Efek muncul dari bawah */
        }
        .invitation-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .invitation-modal h1 {
            font-family: 'Georgia', serif;
            color: #ff4081;
            margin-bottom: 20px;
        }
        .invitation-modal p {
            color: #4b5563;
            margin-bottom: 10px;
        }
        .btn-close {
            margin-top: 30px;
            padding: 10px 20px;
            background: #374151;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="parallax-container" id="scene">
        <div class="scroll-hint" id="hintText">↓ Scroll / Swipe Up Untuk Masuk ↓</div>

        <div class="zoom-element character-layer" id="charLayer">
            <div class="dummy-avatar"></div>
        </div>

        <div class="zoom-element envelope-layer" id="envelopeLayer">
            <div class="envelope" id="envelopeBtn">KLIK SURAT</div>
        </div>

        <div class="invitation-modal" id="invitationModal">
            <h1>Selamat Datang di Pernikahan Kami</h1>
            <p><strong>Romeo & Juliet</strong></p>
            <p>Minggu, 12 Desember 2026</p>
            <p>Gedung Kebahagiaan, Bandung</p>
            <p style="font-size: 0.8rem; margin-top: 15px; color: #9ca3af;">(Ini adalah halaman detail isi undangan pernikahanmu secara lengkap)</p>
            <button class="btn-close" id="btnClose">Tutup Undangan</button>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const charLayer = document.getElementById('charLayer');
        const envelopeLayer = document.getElementById('envelopeLayer');
        const hintText = document.getElementById('hintText');
        const envelopeBtn = document.getElementById('envelopeBtn');
        const invitationModal = document.getElementById('invitationModal');
        const btnClose = document.getElementById('btnClose');

        let scrollProgress = 0; // Angka 0 sampai 100 yang mencatat tingkat zoom
        let touchStartY = 0;

        // FUNGSI UTAMA UNTUK MENGATUR ANIMASI BERDASARKAN PROGRES (0 - 100)
        function updateZoom() {
            // Batasi progres agar tidak kurang dari 0 atau lebih dari 100
            scrollProgress = Math.max(0, Math.min(100, scrollProgress));

            // 1. Animasi Karakter Utama (Membesar dari scale 1 ke 4, opacity memudar jadi 0)
            const charScale = 1 + (scrollProgress * 0.03); 
            const charOpacity = 1 - (scrollProgress / 70); // Menghilang lebih cepat di progess ke 70
            charLayer.style.transform = `scale(${charScale})`;
            charLayer.style.opacity = charOpacity;

            // 2. Animasi Surat (Membesar dari scale 0.

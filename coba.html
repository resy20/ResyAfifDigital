<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan 3D Sempurna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER UTAMA DENGAN PERSPEKTIF 3D */
        .parallax-container {
            position: relative;
            width: 100%;
            max-width: 412px;
            height: 90vh;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
            
            /* Kunci Efek 3D: Memberi jarak pandang kamera ke dalam layar */
            perspective: 800px;
            perspective-origin: center center;
        }

        /* PANGGUNG 3D (Tempat semua layer berada) */
        .3d-stage {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* Efek maju mundurnya kamera diatur di sini */
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Pengaturan Dasar Semua Layer */
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* ========================
           PENGATURAN JARAK 3D (Z-AXIS)
           ======================== */

        /* 1. LAYER BACKGROUND (Paling Jauh di Belakang) */
        .layer-bg {
            transform: translateZ(-400px) scale(1.5); 
            z-index: 1;
        }
        .cloud-dummy {
            width: 300px;
            height: 120px;
            background: rgba(255,255,255,0.7);
            border-radius: 60px;
            filter: blur(8px);
            position: absolute;
            top: 20%;
        }

        /* 2. LAYER TENGAH (Karakter Utama) */
        .layer-char {
            transform: translateZ(0px); /* Berada di titik tengah koordinat */
            z-index: 2;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }
        .dummy-avatar {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #ff80ab 0%, #ff4081 100%);
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(255,64,129,0.3);
            margin-bottom: 20px;
        }
        .btn-start {
            padding: 12px 28px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 3. LAYER DEPAN BLUR (Kupu-kupu/Dedaunan Terbang) */
        .layer-fg {
            transform: translateZ(250px); /* Sangat dekat dengan mata/kamera */
            z-index: 4;
            pointer-events: none;
        }
        .leaf-1, .leaf-2 {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ffeb3b;
            border-radius: 50% 0 50% 50%;
            filter: blur(4px); /* Efek blur depan */
            opacity: 0.8;
        }
        .leaf-1 { top: 15%; left: 10%; transform: rotate(45deg); }
        .leaf-2 { bottom: 25%; right: 10%; transform: rotate(-15deg); background: #00e676; width: 80px; height: 80px;}

        /* 4. LAYER SURAT (Berada agak di belakang karakter awalnya) */
        .layer-envelope {
            transform: translateZ(-200px); 
            z-index: 3;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .envelope {
            width: 180px;
            height: 130px;
            background-color: #ffb74d;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-top: 65px solid #f57c00;
            border-radius: 8px 8px 0 0;
        }

        /* 5. POP-UP DETAIL ISI UNDANGAN (MODAL) */
        .invitation-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            transform: translateY(100%);
        }
        .invitation-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* ========================
           STATE ANIMASI 3D ZOOM IN
           ======================== */
        
        /* Kamera melaju masuk ke dalam sejauh 350px mendobrak ruang 3D */
        .state-zoom .3d-stage {
            transform: translateZ(350px);
        }

        /* Saat di-zoom, karakter memudar agar tidak menghalangi surat di belakangnya */
        .state-zoom .layer-char {
            opacity: 0;
            pointer-events: none;
        }

        /* Surat menjadi jelas kelihatan */
        .state-zoom .layer-envelope {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="parallax-container" id="mainContainer">
        <div class="3d-stage">
            
            <div class="layer layer-bg">
                <div class="cloud-dummy"></div>
            </div>

            <div class="layer layer-envelope">
                <div class="envelope" id="btnSurat">KLIK SURAT</div>
            </div>

            <div class="layer layer-char">
                <div class="dummy-avatar"></div>
                <button class="btn-start" id="btnBuka">Lihat Undangan</button>
            </div>

            <div class="layer layer-fg">
                <div class="leaf-1"></div>
                <div class="leaf-2"></div>
            </div>

        </div>

        <div class="invitation-modal" id="modalUndangan">
            <h1 style="font-family: 'Georgia', serif; color: #ff4081; margin-bottom: 20px;">The Wedding of</h1>
            <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">Romeo & Juliet</p>
            <p>Sabtu, 12 Desember 2026</p>
            <button class="btn-start" id="btnTutup" style="margin-top: 30px; background-color: #9ca3af;">Kembali</button>
        </div>
    </div>

    <script>
        const mainContainer = document.getElementById('mainContainer');
        const btnBuka = document.getElementById('btnBuka');
        const btnSurat = document.getElementById('btnSurat');
        const modalUndangan = document.getElementById('modalUndangan');
        const btnTutup = document.getElementById('btnTutup');

        btnBuka.addEventListener('click', () => {
            mainContainer.classList.add('state-zoom');
        });

        btnSurat.addEventListener('click', () => {
            modalUndangan.classList.add('active');
        });

        btnTutup.addEventListener('click', () => {
            modalUndangan.classList.remove('active');
            mainContainer.classList.remove('state-zoom');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Zoom Parallax Undangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .parallax-container {
            position: relative;
            width: 100%;
            max-width: 412px;
            height: 90vh;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            background: #fff;
            perspective: 1000px;
        }

        /* Base class untuk semua layer */
        .layer {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Tambahkan transform pada transition agar pergerakan zoom & mouse smooth */
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* LAYER 1: BACKGROUND */
        .layer-bg {
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 100%);
            z-index: 1;
        }

        /* LAYER 2: MIDGROUND (Karakter Utama) */
        .layer-mid {
            z-index: 2;
        }
        .dummy-avatar {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #ff80ab 0%, #ff4081 100%);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(255,64,129,0.3);
            border: 6px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }

        /* LAYER 3: FOREGROUND (Elemen Depan Blur) */
        .layer-fg {
            z-index: 4;
            pointer-events: none;
        }
        .floating-element-1, .floating-element-2 {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ffeb3b;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            filter: blur(3px);
            opacity: 0.8;
        }
        .floating-element-1 { top: 20%; left: 15%; }
        .floating-element-2 { bottom: 30%; right: 15%; width: 70px; height: 70px; background: #00e676;}

        /* --- KONTEN TEKS & TOMBOL AWAL --- */
        .wedding-info {
            position: absolute;
            width: 100%;
            bottom: 12%;
            text-align: center;
            z-index: 3;
            color: #374151;
            padding: 0 20px;
            transition: opacity 0.5s ease;
        }
        .wedding-info h1 {
            font-size: 1.8rem;
            font-family: 'Georgia', serif;
            margin-bottom: 15px;
        }
        .btn-open {
            padding: 10px 24px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- LAYER DETAIL TULISAN (Sembunyi di Awal) --- */
        .layer-detail {
            position: absolute;
            width: 80%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5); /* Mulai dari kecil */
            z-index: 5;
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            opacity: 0; /* Tidak terlihat di awal */
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Efek pop-up membal */
        }
        .layer-detail h2 {
            font-family: 'Georgia', serif;
            color: #ff4081;
            margin-bottom: 10px;
        }

        /* --- STATE AKTIF SAAT ZOOM IN (Dicuci oleh JS) --- */
        
        /* Background nge-zoom sedikit */
        .zoomed .layer-bg { transform: scale(1.3); }
        
        /* Karakter utama nge-zoom besar (efek kamera mendekat) dan menghilang */
        .zoomed .layer-mid { transform: scale(3.5); opacity: 0; pointer-events: none; }
        
        /* Elemen depan terlempar keluar layar karena kamera masuk melewati mereka */
        .zoomed .layer-fg { transform: scale(4); opacity: 0; }
        
        /* Teks dan tombol awal hilang */
        .zoomed .wedding-info { opacity: 0; pointer-events: none; }

        /* Kotak detail muncul, membesar ke ukuran asli, dan bisa diklik */
        .zoomed .layer-detail {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="parallax-container" id="scene">
        <div class="layer layer-bg" data-speed="1"></div>
        <div class="layer layer-mid" data-speed="3">
            <div class="dummy-avatar">Aset Karakter</div>
        </div>
        <div class="layer layer-fg" data-speed="6">
            <div class="floating-element-1"></div>
            <div class="floating-element-2"></div>
        </div>
        
        <div class="wedding-info" id="mainInfo">
            <h1>Romeo & Juliet</h1>
            <button class="btn-open" id="btnOpen">Buka Undangan</button>
        </div>

        <div class="layer-detail" id="detailBox">
            <h2>Acara Pernikahan</h2>
            <p style="margin-bottom: 15px; color: #6b7280;">Sabtu, 12 Desember 2026</p>
            <p style="font-size: 0.9rem; color: #374151;">Pukul: 09.00 WIB - Selesai<br>Gedung Serbaguna Kebahagiaan</p>
            <button class="btn-open" id="btnBack" style="margin-top: 20px; background-color: #9ca3af; padding: 6px 15px; font-size: 0.8rem;">Kembali</button>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const layers = document.querySelectorAll('.layer');
        const btnOpen = document.getElementById('btnOpen');
        const btnBack = document.getElementById('btnBack');

        let isZoomed = false;

        // 1. Logika Efek Parallax Kursor (Hanya jalan kalau BELUM zoom)
        scene.addEventListener('mousemove', (e) => {
            if (isZoomed) return; // Kunci efek mouse jika sedang posisi zoom-in
            
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left - (rect.width / 2);
            const y = e.clientY - rect.top - (rect.height / 2);

            layers.forEach(layer => {
                const speed = layer.getAttribute('data-speed');
                const xMove = (x * speed) / 80; 
                const yMove = (y * speed) / 80;
                layer.style.transform = `translateX(${xMove}px) translateY(${yMove}px)`;
            });
        });

        scene.addEventListener('mouseleave', () => {
            if (isZoomed) return;
            layers.forEach(layer => {
                layer.style.transform = `translateX(0px) translateY(0px)`;
            });
        });

        // 2. Logika Tombol Memicu EFEK ZOOM IN
        btnOpen.addEventListener('click', () => {
            isZoomed = true;
            // Menghapus sisa gaya pergeseran mouse agar transisi zoom presisi di tengah
            layers.forEach(layer => layer.style.transform = ''); 
            
            // Menambahkan class .zoomed ke container utama
            scene.classList.add('zoomed');
        });

        // 3. Logika Tombol Kembali (Zoom Out)
        btnBack.addEventListener('click', () => {
            isZoomed = false;
            scene.classList.remove('zoomed');
        });
    </script>
</body>
</html>

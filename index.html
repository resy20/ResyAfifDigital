<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>The Wedding of Resy & Afif – 27 Desember 2026</title>
<meta property="og:title" content="The Wedding of Resy & Afif"/>
<meta property="og:description" content="27 Desember 2026 · Cilaja Hilir, Sindanglaya, Kab. Bandung"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════
   VARIABLE WARNA & DASAR (Broken White Theme)
   Dominan Broken White dengan Aksen Hijau, Kuning, Oranye & Putih
═══════════════════════════════════ */
:root {
  --white:      #FFFFFF;
  --broken-white: #FAF7F0; /* Latar Belakang Utama */
  --cream:      #F4EFE6;
  
  --green:      #2E6B35;
  --green-mid:  #4A8C52;
  --green-lt:   #7CB87F;
  --green-pale: #C8E6CA;
  --green-bg:   #EBF5EC;

  /* Komponen Sage untuk Surat */
  --sage:       #9CAF88;
  --sage-dark:  #7A8C66;
  --sage-pale:  #D2DDD4;

  --orange:     #E09520;
  --yellow:     #C8960A;
  --yellow-mid: #E5B030;
  --yellow-lt:  #F5D060;
  --yellow-pale:#FEF3C0;
  --yellow-bg:  #FFFBEB;

  --dark:       #1E3D22;
  --text:       #1E3D22;
  --text-mid:   #3D6642;
  --text-lt:    #7A9E7E;
  --border:     rgba(46,107,53,0.15);
  --ease:       cubic-bezier(0.22,1,0.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html { scroll-behavior:smooth; }
body { font-family:'Cormorant Garamond',serif; background:var(--broken-white); color:var(--dark); overflow-x:hidden; }

/* ── ANIMASI KEYFRAMES BERSAMA ── */
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes slideUp   { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes floatY    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes floatYR   { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
@keyframes ringSpin  { to{transform:translate(-50%,-50%) rotate(360deg)} }
@keyframes ringSpinR { to{transform:translate(-50%,-50%) rotate(-360deg)} }
@keyframes borderDance {
  0%,100%{ border-color:var(--green-lt) }
  33%    { border-color:var(--yellow-mid) }
  66%    { border-color:var(--orange) }
}
/* Animasi Putaran Bunga Matahari */
@keyframes sunflowerRotate {
  0% { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}
/* Animasi Jatuhnya Elemen Kelopak/Bunga */
@keyframes fallAnimation {
  0%   { transform: translateY(-60px) translateX(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
}
@keyframes hintBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(5px)} }

/* Latar Belakang & Panggung Ornamen */
.bg-layer { position:fixed; inset:0; pointer-events:none; z-index:0; background: linear-gradient(160deg, #FAF7F0 0%, #F4EFE6 50%, #EBF5EC 100%); }
.ring { position:fixed; border-radius:50%; border:1px solid; top:50%; left:50%; pointer-events:none; z-index:1; }
#petal-wrap { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:2; }

/* Struktur CSS untuk komponen bunga/daun gugur */
.falling-element { position:absolute; top:-40px; animation:fallAnimation linear infinite; --drift:0px; --spin:360deg; pointer-events:none; }
.sf-mini { display: block; width: 100%; height: 100%; }

/* ═══════════════════════════
   SCREEN 1 — LANDING (3D)
═══════════════════════════ */
#s-land { position:fixed; inset:0; z-index:10; perspective:900px; overflow:hidden; display:flex; align-items:center; justify-content:center; transition: opacity 0.75s ease; }
.scene { width:100%; height:100%; transform-style:preserve-3d; position:relative; }
.d-back { position:absolute; inset:0; transform:translateZ(-200px) scale(1.3); pointer-events:none; }
.d-mid { position:absolute; inset:0; transform:translateZ(0px); pointer-events:none; }
.d-fore { position:absolute; inset:0; transform:translateZ(120px) scale(0.85); pointer-events:none; filter:blur(1.5px); }
.d-ui { position:absolute; inset:0; transform:translateZ(200px) scale(0.78); display:flex; flex-direction:column; align-items:center; justify-content:center; }

.l-tag { font-size:10px; letter-spacing:5px; text-transform:uppercase; color:var(--text-mid); margin-bottom:14px; animation:fadeUp 0.8s 0.3s both; font-weight: 600; }
.l-bride { font-size:clamp(50px,12vw,76px); color:var(--green); font-weight:600; line-height:0.92; font-family:'Playfair Display',serif; text-shadow:0 2px 14px rgba(46,107,53,0.15); animation:fadeUp 0.9s 0.5s both; }
.l-amp { font-style:italic; color:var(--orange); font-size:1.2em; display:block; line-height:0.9; }
.l-groom { font-size:clamp(50px,12vw,76px); color:var(--green); font-weight:600; line-height:0.92; font-family:'Playfair Display',serif; text-shadow:0 2px 14px rgba(46,107,53,0.15); animation:fadeUp 0.9s 0.7s both; }
.l-date { font-size:13px; letter-spacing:6px; color:var(--text-mid); margin:14px 0; animation:fadeUp 0.8s 1.1s both; font-weight: 600; }
.l-guest { background:var(--white); border:1px solid var(--green-pale); border-radius:8px; padding:10px 24px; margin:10px auto; display:none; backdrop-filter:blur(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.l-guest-to { font-size:10px; letter-spacing:3px; color:var(--text-lt); }
.l-guest-name { font-size:20px; font-style:italic; color:var(--orange); font-family:'Playfair Display',serif; font-weight: 600; }
.l-prog { margin-top:26px; animation:fadeUp 0.8s 1.4s both; }
.l-prog-lbl { font-size:10px; letter-spacing:3px; color:var(--text-lt); margin-bottom:7px; text-align:center; }
.l-prog-bar { width:160px; height:2px; background:var(--green-pale); border-radius:2px; margin:0 auto; overflow:hidden; }
.l-prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--green-lt),var(--orange),var(--green-lt)); background-size:200%; animation:shimmer 2s linear infinite; }

/* ═══════════════════════════
   SCREEN 2 — ENVELOPE (3D ZOOM)
═══════════════════════════ */
#s-env { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; opacity:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.env-scroll-box { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; padding-bottom: 140px; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
.env-wrap { position:relative; width:min(300px,80vw); z-index:10; cursor:pointer; transition: margin-top 0.6s ease; }

.env-body { width:100%; padding-bottom:66%; background:linear-gradient(145deg, var(--sage), var(--sage-dark)); border-radius:6px; border:1.5px solid var(--sage-pale); position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(122,140,102,0.25); }
.env-lines { position:absolute; inset:0; background: linear-gradient(135deg,transparent 49.5%,rgba(255,255,255,0.08) 49.5%,rgba(255,255,255,0.08) 50.5%,transparent 50.5%), linear-gradient(-135deg,transparent 49.5%,rgba(255,255,255,0.08) 49.5%,rgba(255,255,255,0.08) 50.5%,transparent 50.5%); }
.env-inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }

.env-cpl { font-size:16px; font-style:italic; color:var(--white); letter-spacing:2px; font-family:'Playfair Display',serif; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.15); }
.env-dt { font-size:10px; color:var(--sage-pale); letter-spacing:3px; }

.env-flap-w { position:absolute; top:0; left:0; right:0; height:56%; perspective:700px; perspective-origin:50% 0%; overflow:visible; z-index:5;}
.env-flap { width:100%; height:100%; background:linear-gradient(175deg, #8A9C76, var(--sage)); clip-path:polygon(0 0,50% 88%,100% 0); transform-origin:top center; transform-style:preserve-3d; will-change:transform; }

/* PERBAIKAN SEGAL/TOMBOL: Menutup Bagian Tengah yang Bolong dengan Struktur SVG Berlapis */
.env-seal { 
  position:absolute; top:54%; left:50%; 
  transform:translate(-50%, -50%); 
  width:64px; height:64px; 
  z-index:20; 
  animation: sunflowerRotate 20s linear infinite; 
  pointer-events: none; 
}

.env-hint { position:absolute; bottom:-36px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:3px; color:var(--text-mid); white-space:nowrap; animation:hintBob 2s ease-in-out infinite; font-weight: 600; }

.env-paper { position:absolute; top:calc(100% - 12px); left:50%; transform:translateX(-50%); width:94%; background:var(--white); border-radius:0 0 8px 8px; border:1px solid var(--green-pale); border-top:none; padding:0; opacity:0; will-change:transform,opacity; z-index:3; box-shadow:0 16px 48px rgba(46,107,53,0.12); }
.paper-inner { padding:18px 16px 22px; overflow:visible; max-height:none; padding-bottom: 40px; }
.paper-orn { text-align:center; color:var(--orange); font-size:14px; margin-bottom:10px; }
.paper-arabic { font-size:20px; text-align:center; color:var(--green); margin-bottom:6px; }
.paper-couple { font-size:22px; font-style:italic; text-align:center; color:var(--green); font-family:'Playfair Display',serif; margin-bottom:2px; font-weight: 600; }
.paper-tag { font-size:8px; letter-spacing:3px; text-align:center; color:var(--text-mid); margin-bottom:14px; }
.paper-hr { border:none; border-top:1px solid var(--green-pale); margin:10px 0; }

.pol-row { display:flex; justify-content:center; gap:10px; margin:14px 0; padding:0 4px; }
.pol { background:var(--broken-white); padding:6px 6px 20px; box-shadow:0 4px 14px rgba(0,0,0,0.08); flex:1; max-width:90px; transform:rotate(0deg); transition:transform 0.2s; border: 1px solid rgba(0,0,0,0.05); }
.pol:nth-child(1){transform:rotate(-4deg);}
.pol:nth-child(2){transform:rotate(1deg);margin-top:-6px;}
.pol:nth-child(3){transform:rotate(5deg);}
.pol:hover { transform:rotate(0deg) scale(1.05)!important; z-index:10; }
.pol img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.pol-cap { text-align:center; font-size:8px; color:var(--text-mid); margin-top:5px; font-family:'Playfair Display',serif; font-style:italic; }
.paper-quote { font-size:13px; font-style:italic; text-align:center; color:var(--text-mid); line-height:1.75; font-family:'Playfair Display',serif; padding:12px 8px; border-top:1px solid var(--green-pale); border-bottom:1px solid var(--green-pale); margin:4px 0 12px; }
.paper-quote-names { font-size:10px; text-align:center; color:var(--orange); letter-spacing:2px; margin-bottom:14px; font-weight: 600; }
.paper-cta { display:block; width:100%; padding:12px; background:linear-gradient(135deg,var(--green),var(--green-mid)); color:var(--white); border:none; border-radius:6px; font-size:13px; letter-spacing:2px; cursor:pointer; text-align:center; font-family:'Playfair Display',serif; text-decoration:none; box-shadow:0 4px 16px rgba(46,107,53,0.2); transition:transform 0.2s; }
.paper-cta:hover { transform:translateY(-1px); }

/* ═══════════════════════════
   SCREEN 3 — MAIN INVITATION CONTENT
═══════════════════════════ */
#main { display:none; opacity:0; z-index:30; position:relative; width:100%; background: var(--broken-white); }
.sticky-nav { position:sticky; top:0; z-index:90; display:flex; justify-content:center; background:var(--green); border-bottom:2px solid var(--yellow-mid); overflow-x:auto; scrollbar-width:none; }
.sticky-nav::-webkit-scrollbar { display:none; }
.sticky-nav a { padding:10px 14px; color:var(--green-pale); text-decoration:none; font-size:11px; letter-spacing:2px; text-transform:uppercase; white-space:nowrap; transition:color 0.2s; font-family:'Lato',sans-serif; }
.sticky-nav a:hover { color:var(--white); }

.reveal { opacity:0; transform:translateY(40px); transition:opacity 0.8s var(--ease),transform 0.8s var(--ease); }
.reveal.visible { opacity:1; transform:translateY(0); }

section { position:relative; }
.sec-header { text-align:center; padding:56px 24px 28px; }
.sec-title { font-family:'Playfair Display',serif; font-size:clamp(28px,6vw,40px); color:var(--green); font-weight:600; margin:10px 0; }
.sec-title.light { color:var(--green); } 
.sec-sub { font-size:15px; color:var(--text-mid); font-style:italic; margin-top:6px; }

.orn { display:flex; align-items:center; gap:10px; margin:10px auto; max-width:260px; }
.orn::before,.orn::after { content:''; flex:1; height:1px; }
.orn.green::before,.orn.green::after { background:linear-gradient(90deg,transparent,var(--green-lt),transparent); }
.orn.green span { color:var(--orange); font-size:14px; }
.orn.white::before,.orn.white::after { background:linear-gradient(90deg,transparent,var(--green-pale),transparent); }
.orn.white span { color:var(--orange); font-size:14px; }

/* Komponen Sections */
.hero { background: linear-gradient(180deg, var(--white) 0%, var(--broken-white) 100%); padding:60px 24px; text-align:center; min-height:55vh; display:flex; align-items:center; justify-content:center; }
.hero-inner { max-width:600px; position:relative; z-index:2; }
.hero-bismillah { font-family:'Playfair Display',serif; font-size:30px; color:var(--green); margin-bottom:20px; letter-spacing:2px; }
.hero-ayat { font-size:16px; line-height:2; color:var(--text-mid); font-style:italic; max-width:480px; margin:0 auto; }
.hero-ayat-src { font-size:12px; color:var(--orange); letter-spacing:2px; margin-top:8px; font-weight: 600; }
.hero-announce { font-size:15px; color:var(--text-mid); margin:20px 0 8px; }
.hero-guest { font-family:'Playfair Display',serif; font-size:28px; font-style:italic; color:var(--orange); min-height:38px; font-weight: 600; }

.couple-sec { background:var(--white); padding-bottom:60px; }
.couple-grid { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:16px; padding:0 24px; max-width:600px; margin:0 auto; }
.couple-card { text-align:center; }
.photo-wrap { position:relative; width:140px; height:175px; margin:0 auto 14px; }
.photo-wrap img { width:100%; height:100%; object-fit:cover; border-radius:6px; }
.photo-border { position:absolute; inset:-6px; border:2px solid var(--green-lt); border-radius:6px; animation:borderDance 4s ease-in-out infinite; opacity:0.6; }
.photo-badge { position:absolute; bottom:-11px; left:50%; transform:translateX(-50%); background:var(--orange); color:var(--white); font-size:9px; padding:3px 10px; border-radius:20px; letter-spacing:1px; white-space:nowrap; }
.couple-name { font-family:'Playfair Display',serif; font-size:26px; font-style:italic; color:var(--green); margin-top:18px; font-weight: 600; }
.couple-full { font-size:13px; color:var(--text-mid); margin:3px 0 6px; }
.couple-parents { font-size:12px; color:var(--text-lt); line-height:1.8; }
.couple-and { font-family:'Playfair Display',serif; font-size:56px; font-style:italic; color:var(--orange); line-height:1; text-align:center; }

.event-sec { background: var(--broken-white); padding-bottom:60px; }
.event-cards { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:20px; padding:0 20px; position:relative; z-index:2; }
.event-card { background:var(--white); border:1px solid var(--green-pale); border-radius:10px; padding:30px 26px; max-width:280px; flex:1 1 240px; text-align:center; box-shadow: 0 4px 20px rgba(46,107,53,0.05); transition:transform 0.3s, background 0.3s; }
.event-card:hover { transform:translateY(-4px); box-shadow: 0 10px 25px rgba(46,107,53,0.1); }
.event-icon { font-size:28px; margin-bottom:12px; }
.event-type { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--orange); margin-bottom:14px; font-weight: 600; }
.event-day { font-size:13px; color:var(--text-mid); letter-spacing:2px; }
.event-date { font-family:'Playfair Display',serif; font-size:20px; color:var(--green); margin:4px 0 8px; font-weight: 600; }
.event-time { font-size:15px; color:var(--text-mid); margin-bottom:12px; }
.event-loc { font-size:13px; color:var(--text-lt); line-height:1.9; }
.event-div { font-size:28px; color:var(--orange); opacity:0.5; display:flex; align-items:center; }

.cd-wrap { position:relative; z-index:2; margin-top:40px; text-align:center; padding:0 20px; }
.cd-label { font-size:10px; letter-spacing:4px; color:var(--text-mid); margin-bottom:16px; font-weight: 600; }
.cd-nums { display:flex; align-items:center; justify-content:center; gap:10px; }
.cd-unit { text-align:center; }
.cd-num { font-family:'Playfair Display',serif; font-size:48px; color:var(--green); line-height:1; min-width:60px; font-weight: 600; }
.cd-lbl { font-size:10px; letter-spacing:2px; color:var(--text-lt); text-transform:uppercase; }
.cd-sep { font-size:40px; color:var(--orange); opacity:0.4; margin-bottom:18px; }
.map-wrap { position:relative; z-index:2; margin-top:30px; text-align:center; }
.map-btn { display:inline-block; padding:12px 30px; border:1px solid var(--green-lt); border-radius:6px; color:var(--green); background: var(--white); text-decoration:none; font-size:14px; letter-spacing:1px; transition:all 0.3s; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
.map-btn:hover { background:var(--green-bg); color:var(--green); border-color:var(--green); }

.gallery-sec { background:var(--white); padding-bottom:60px; }
.gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:160px; gap:5px; padding:0 12px; }
.g-item { overflow:hidden; border-radius:6px; position:relative; cursor:pointer; }
.g-item img { width:100%; height:100%; object-fit:cover; transition:transform 0.6s var(--ease); }
.g-item:hover img { transform:scale(1.06); }
.g-item.tall { grid-row:span 2; }
.g-item.wide { grid-column:span 2; }
.g-item::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(46,107,53,0.1) 0%, rgba(224,149,32,0.1) 100%); opacity:0; transition:opacity 0.3s; }
.g-item:hover::after { opacity:1; }

.story-sec { background:var(--broken-white); padding-bottom:60px; }
.story-content { flex:1; background:var(--white); border-radius:10px; padding:20px; border:1px solid var(--green-pale); box-shadow:0 4px 20px rgba(0,0,0,0.03); }
.story-text { font-size:14px; color:var(--text-mid); line-height:1.8; }
.story-video { margin-top:14px; border-radius:8px; overflow:hidden; aspect-ratio:9/16; background:transparent; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

.rsvp-sec { background:var(--white); padding-bottom:60px; }
.rsvp-form { max-width:500px; margin:0 auto 32px; padding:0 20px; }
.f-group { margin-bottom:16px; }
.f-group"><label class="f-label">Nama Lengkap</label><input type="text" class="f-input" id="rsvp-name"/></div>
      <div class="f-group"><label class="f-label">Jumlah Tamu</label><input type="number" class="f-input" id="rsvp-count" value="1"/></div>
      <div class="f-group">
        <label class="f-label">Kehadiran</label>
        <div class="radio-row">
          <div class="radio-opt sel" data-v="hadir" onclick="selOpt(this)">✓ Hadir</div>
          <div class="radio-opt" data-v="tidak" onclick="selOpt(this)">✗ Tidak</div>
        </div>
        <input type="hidden" id="rsvp-choice" value="hadir"/>
      </div>
      <div class="f-group"><label class="f-label">Pesan</label><textarea class="f-input" id="rsvp-msg" rows="2"></textarea></div>
      <button class="btn-main" onclick="submitRsvp()">Kirim Konfirmasi</button>
    </div>
    <div class="rsvp-list reveal" id="rsvp-list"></div>
  </section>

  <section class="wishes-sec" id="sec-wishes">
    <div class="sec-header reveal">
      <div class="orn white"><span>✦</span></div>
      <h2 class="sec-title light">Ucapan & Doa</h2>
      <div class="orn white"><span>✦</span></div>
    </div>
    <div class="wishes-form reveal">
      <div class="f-group"><label class="f-label light">Nama</label><input type="text" class="f-input dark" id="wish-name"/></div>
      <div class="f-group"><label class="f-label light">Ucapan & Doa</label><textarea class="f-input dark" id="wish-text" rows="4"></textarea></div>
      <button class="btn-main" onclick="submitWish()">Kirim Ucapan</button>
    </div>
    <div class="wishes-list reveal" id="wishes-list"></div>
  </section>

  <section class="qr-sec" id="sec-qr">
    <div class="qr-wrap reveal">
      <div class="qr-card">
        <div class="qr-couple">Resy & Afif</div>
        <div id="qr-container"></div>
        <div class="qr-guest-val" id="qr-name-display">–</div>
      </div>
    </div>
  </section>

  <section class="container-sec">
    <div class="closing-inner reveal">
      <p class="closing-text">Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir.</p>
      <p class="closing-couple">Resy & Afif</p>
    </div>
  </section>
</main>

<div id="bgm-player">
  <button class="bgm-btn" id="bgmBtn" onclick="toggleBgm()">❚❚</button>
  <span class="bgm-lbl">Jalaraning Tresna – Ilham Pradana</span>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ════════════════════════════════════
   LOGIKA INTEGRASI BACKEND & SPA
════════════════════════════════════ */
const SB_URL = 'https://bijessmsedrtfxbnieza.supabase.co';
const SB_KEY = 'sb_publishable_mmiBBx94Ri1-PjFQE6DyHQ_oElTvxJG';

const sb = {
  h: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
  async get(t) { try { const r = await fetch(`${SB_URL}/rest/v1/${t}?select=*&order=created_at.desc`, { headers: sb.h }); return r.ok ? await r.json() : null; } catch { return null; } },
  async post(t, d) { try { const r = await fetch(`${SB_URL}/rest/v1/${t}`, { method: 'POST', headers: { ...sb.h, Prefer: 'return=representation' }, body: JSON.stringify(d) }); return r.ok ? await r.json() : null; } catch { return null; } }
};

const fallRsvp = [{ name: 'Keluarga H. Dadan', count: 4, status: 'hadir', message: 'InsyaAllah hadir', created_at: new Date().toISOString() }];
const fallWishes = [{ name: 'Keluarga Sonjaya', text: 'Selamat menempuh hidup baru!', created_at: new Date().toISOString() }];

let bgmOn=false, envOpened=false, guestName = '';

function getParam(k) { return new URLSearchParams(location.search).get(k) || ''; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }

// Kelopak Bunga Gugur
(function createFallingElements(){
  const c = document.getElementById('petal-wrap');
  
  for(let i=0; i<25; i++){
    const p = document.createElement('div'); 
    p.className = 'falling-element';
    
    const left = Math.random() * 100; 
    const dur = 7 + Math.random() * 8; 
    const delay = -Math.random() * 12; 
    const dx = (Math.random() - 0.5) * 160;
    const isLeaf = Math.random() > 0.75; // 25% daun, 75% bunga matahari mini
    
    const size = isLeaf ? (6 + Math.random() * 5) : (14 + Math.random() * 8);
    
    if (isLeaf) {
      p.style.cssText = `
        width: ${size}px; height: ${size * 1.5}px; background: #9CAF88;
        left: ${left}%; animation: fallAnimation ${dur}s linear ${delay}s infinite; 
        --drift: ${dx}px; --spin: ${360 + Math.random() * 360}deg;
        border-radius: 50% 0 50% 50%; opacity: 0.7;
      `;
    } else {
      // Kelopak gugur berbentuk bunga matahari mini padat penuh
      p.innerHTML = `
        <svg class="sf-mini" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="12" fill="#FFD700"/>
          <g fill="#FFD700">
            <circle cx="20" cy="6" r="4.5" transform="rotate(0 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(45 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(90 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(135 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(180 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(225 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(270 20 20)"/>
            <circle cx="20" cy="6" r="4.5" transform="rotate(315 20 20)"/>
          </g>
          <circle cx="20" cy="20" r="8" fill="#E09520"/>
          <circle cx="20" cy="20" r="5.5" fill="#5C3A21"/>
        </svg>
      `;
      p.style.cssText = `
        width: ${size}px; height: ${size}px;
        left: ${left}%; animation: fallAnimation ${dur}s linear ${delay}s infinite; 
        --drift: ${dx}px; --spin: ${360 + Math.random() * 360}deg;
      `;
    }
    c.appendChild(p);
  }
})();

// Musik Pengiring Otomatis
function tryPlay(){
  const a=document.getElementById('bgm'); a.volume=0.5;
  a.play().then(()=>{bgmOn=true; document.getElementById('bgmBtn').textContent='❚❚';}).catch(()=>{});
}
function toggleBgm(){
  const a=document.getElementById('bgm');
  if(bgmOn){a.pause(); bgmOn=false; document.getElementById('bgmBtn').textContent='▶';}
  else{a.play(); bgmOn=true; document.getElementById('bgmBtn').textContent='❚❚';}
}
document.addEventListener('click',function f(){ tryPlay(); document.removeEventListener('click',f); },{once:true});

// Transisi ke Layar Amplop
function showEnv(){
  const land=document.getElementById('s-land');
  const env=document.getElementById('s-env');
  gsap.to(land,{opacity:0,scale:1.05,duration:0.75,onComplete:()=>{
    land.style.display='none'; env.style.display='flex';
    gsap.to(env,{opacity:1,duration:0.6});
  }});
}
window.addEventListener('load',()=>{
  const fill=document.getElementById('lFill');
  const dur=3000, start=Date.now();
  (function tick(){
    const p=Math.min((Date.now()-start)/dur*100,100); fill.style.width=p+'%';
    if(p<100) requestAnimationFrame(tick); else setTimeout(showEnv,200);
  })();
});

// Mekanik Pembuka Amplop & Pergeseran Wadah
function openEnv(){
  if(envOpened)return; envOpened=true;
  document.getElementById('envHint').style.opacity='0';
  gsap.timeline()
    .to('#envSeal',{scale:0,opacity:0,duration:0.3})
    .to('#envFlap',{rotationX:-185,duration:0.8,transformOrigin:'top center'},'-=0.1')
    .to('#envPaper',{top:'100%',opacity:1,duration:0.8})
    .call(()=>{ document.getElementById('envScrollBox').style.transform = 'translateY(-22%)'; },null,'-=0.6');
}

// PEMICU SPA
function showMainInvitation() {
  const env = document.getElementById('s-env');
  const main = document.getElementById('main');
  const player = document.getElementById('bgm-player');
  
  gsap.to(env, { opacity: 0, scale: 0.9, duration: 0.6, onComplete: () => {
    env.style.display = 'none';
    main.style.display = 'block';
    player.style.display = 'flex';
    gsap.to(main, { opacity: 1, duration: 0.6 });
    
    initMainContent();
  }});
}

function selectValidMap() {
  const mapLinks = document.querySelectorAll('.map-btn');
  mapLinks.forEach(link => {
    link.href = "https://maps.google.com/?q=Cilaja+Hilir+Sindanglaya+Kab+Bandung";
  });
}

function initMainContent() {
  const target = new Date('2026-12-27T08:00:00+07:00');
  setInterval(()=>{
    const diff = target - Date.now();
    const pad = n => String(Math.floor(n)).padStart(2,'0');
    if(diff>0){
      document.getElementById('cd-d').textContent = pad(diff/86400000);
      document.getElementById('cd-h').textContent = pad((diff%86400000)/3600000);
      document.getElementById('cd-m').textContent = pad((diff%3600000)/60000);
      document.getElementById('cd-s').textContent = pad((diff%60000)/1000);
    }
  },1000);

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

  loadRsvp(); loadWishes();
  selectValidMap();
  
  const c = document.getElementById('qr-container');
  if(c) {
    c.innerHTML = '';
    new QRCode(c, { text: `GUEST:${guestName}`, width: 150, height: 150, colorDark: '#2E6B35' });
    document.getElementById('qr-name-display').textContent = guestName || 'Tamu Undangan';
  }
}

async function loadRsvp() {
  const el = document.getElementById('rsvp-list'); if(!el) return;
  const data = (await sb.get('rsvp')) || fallRsvp;
  el.innerHTML = data.map(r => `<div class="rsvp-item"><div class="rsvp-name">${r.name}</div><span class="badge bh">✓ Hadir</span></div>`).join('');
}
async function loadWishes() {
  const el = document.getElementById('wishes-list'); if(!el) return;
  const data = (await sb.get('wishes')) || fallWishes;
  el.innerHTML = data.map(w => `<div class="wish-card"><div class="wish-name">${w.name}</div><div class="wish-text">"${w.text}"</div></div>`).join('');
}
async function submitRsvp() {
  const name = document.getElementById('rsvp-name').value.trim();
  if(!name) return toast('⚠️ Mohon isi nama Anda');
  await sb.post('rsvp', { name, count: parseInt(document.getElementById('rsvp-count').value)||1, status: 'hadir', message: document.getElementById('rsvp-msg').value });
  toast('✅ Konfirmasi berhasil!'); loadRsvp();
}
async function submitWish() {
  const name = document.getElementById('wish-name').value.trim();
  const text = document.getElementById('wish-text').value.trim();
  if(!name || !text) return toast('⚠️ Mohon isi nama dan ucapan');
  await sb.post('wishes', { name, text });
  toast('✅ Doa terkirim!'); loadWishes();
}
function selOpt(el) { document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('sel')); el.classList.add('sel'); }

document.addEventListener('DOMContentLoaded', () => {
  guestName = getParam('to');
  if (guestName) {
    document.getElementById('lGuest').style.display = 'block';
    document.getElementById('lGuestName').textContent = guestName;
    document.getElementById('hero-guest').textContent = guestName;
    document.getElementById('rsvp-name').value = guestName;
  } else {
    document.getElementById('hero-guest').textContent = 'Bapak/Ibu/Saudara/i';
  }
});
</script>

  <style>
  /* ═══════════════════════════════════
     RESY & AFIF – Putih · Hijau · Kuning · Biru
     Nuansa Jawa Modern & Segar
  ═══════════════════════════════════ */
  :root {
    --white:      #FFFFFF;
    --off-white:  #F8FBF7;
    --cream:      #F2F7F0;

    --green:      #2E6B35;
    --green-mid:  #4A8C52;
    --green-lt:   #7CB87F;
    --green-pale: #C8E6CA;
    --green-bg:   #EBF5EC;

    --yellow:     #C8960A;
    --yellow-mid: #E5B030;
    --yellow-lt:  #F5D060;
    --yellow-pale:#FEF3C0;
    --yellow-bg:  #FFFBEB;

    --blue:       #1A5496;
    --blue-mid:   #3A74B8;
    --blue-lt:    #7AAAD8;
    --blue-pale:  #CCDFF5;
    --blue-bg:    #EBF3FD;

    --dark:       #0D2410;
    --text:       #1E3D22;
    --text-mid:   #3D6642;
    --text-lt:    #7A9E7E;
    --border:     rgba(46,107,53,0.15);
    --ease:       cubic-bezier(0.22,1,0.36,1);
  }

  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Cormorant Garamond',serif; background:var(--white); color:var(--dark); overflow-x:hidden; }

  /* ── KEYFRAMES ── */
  @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
  @keyframes slideUp   { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes floatY    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes floatYR   { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
  @keyframes rotateS   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes rotateRS  { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
  @keyframes shimmer   { 0%,100%{opacity:0.4} 50%{opacity:1} }
  @keyframes petal     {
    0%   { transform:translateY(-60px) translateX(0) rotate(0deg); opacity:0; }
    10%  { opacity:0.9; }
    90%  { opacity:0.6; }
    100% { transform:translateY(110vh) translateX(var(--drift)) rotate(var(--spin)); opacity:0; }
  }
  @keyframes sparkle {
    0%,100%{ transform:scale(0) rotate(0deg); opacity:0; }
    50%    { transform:scale(1) rotate(180deg); opacity:1; }
  }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(46,107,53,0.3)} 50%{box-shadow:0 0 0 12px rgba(46,107,53,0)} }
  @keyframes waveText {
    0%,100%{ transform:translateY(0) }
    25%    { transform:translateY(-4px) }
    75%    { transform:translateY(4px) }
  }
  @keyframes borderDance {
    0%,100%{ border-color:var(--green-lt) }
    33%    { border-color:var(--yellow-mid) }
    66%    { border-color:var(--blue-lt) }
  }

  /* Petals container */
  #petal-wrap { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .petal {
    position:absolute; top:-40px; border-radius:50% 10% 50% 10%;
    animation:petal linear infinite;
    --drift:0px; --spin:360deg;
  }

  /* Sparkles */
  .sparkle {
    position:absolute; pointer-events:none;
    width:6px; height:6px;
    animation:sparkle ease-in-out infinite;
  }
  .sparkle::before,.sparkle::after {
    content:''; position:absolute; background:var(--yellow-lt);
    border-radius:2px;
  }
  .sparkle::before { width:100%; height:2px; top:50%; transform:translateY(-50%); }
  .sparkle::after  { width:2px; height:100%; left:50%; transform:translateX(-50%); }

  /* Rotating rings */
  .ring {
    position:absolute; border-radius:50%; border:1px solid;
    pointer-events:none;
    animation:rotateS linear infinite;
  }
  .ring-rev { animation:rotateRS linear infinite; }

  /* ═══════════════════════════════════
     MUSIC PLAYER
  ═══════════════════════════════════ */
  .music-player {
    position:fixed; bottom:20px; right:20px; z-index:100;
    display:flex; align-items:center; gap:8px;
    background:var(--green); border-radius:30px;
    padding:8px 16px 8px 8px;
    box-shadow:0 4px 20px rgba(46,107,53,0.35);
    border:1px solid var(--green-lt);
  }
  .music-btn {
    width:34px; height:34px; border-radius:50%;
    background:var(--yellow-mid); color:var(--dark);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:transform 0.2s;
  }
  .music-btn:hover { transform:scale(1.1); }
  .music-label { font-size:11px; color:rgba(255,255,255,0.85); max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ═══════════════════════════════════
     STICKY NAV
  ═══════════════════════════════════ */
  .sticky-nav {
    position:sticky; top:0; z-index:90;
    display:flex; justify-content:center;
    background:var(--green); border-bottom:2px solid var(--yellow-mid);
    overflow-x:auto; scrollbar-width:none;
  }
  .sticky-nav::-webkit-scrollbar { display:none; }
  .sticky-nav a {
    padding:10px 14px; color:rgba(200,230,200,0.75);
    text-decoration:none; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; white-space:nowrap;
    transition:color 0.2s; font-family:'Lato',sans-serif;
  }
  .sticky-nav a:hover { color:#FFFFFF; }

  /* ═══════════════════════════════════
     SCROLL REVEAL
  ═══════════════════════════════════ */
  .reveal { opacity:0; transform:translateY(40px); transition:opacity 0.8s var(--ease),transform 0.8s var(--ease); }
  .reveal.visible { opacity:1; transform:translateY(0); }
  .reveal-l { opacity:0; transform:translateX(-40px); transition:opacity 0.8s var(--ease),transform 0.8s var(--ease); }
  .reveal-r { opacity:0; transform:translateX(40px); transition:opacity 0.8s var(--ease),transform 0.8s var(--ease); }
  .reveal-l.visible,.reveal-r.visible { opacity:1; transform:translateX(0); }
  .d1{transition-delay:0.1s}.d2{transition-delay:0.2s}.d3{transition-delay:0.3s}.d4{transition-delay:0.4s}

  /* ═══════════════════════════════════
     SECTION COMMONS
  ═══════════════════════════════════ */
  section { position:relative; }
  .sec-header { text-align:center; padding:56px 24px 28px; }
  .sec-title {
    font-family:'Playfair Display',serif;
    font-size:clamp(28px,6vw,40px); color:var(--green); font-weight:600;
    margin:10px 0;
  }
  .sec-title.light { color:#FFFFFF; }
  .sec-sub { font-size:15px; color:var(--text-lt); font-style:italic; margin-top:6px; }

  /* Ornament line */
  .orn { display:flex; align-items:center; gap:10px; margin:10px auto; max-width:260px; }
  .orn::before,.orn::after { content:''; flex:1; height:1px; }
  .orn.green::before,.orn.green::after { background:linear-gradient(90deg,transparent,var(--green-lt),transparent); }
  .orn.green span { color:var(--yellow-mid); font-size:14px; }
  .orn.white::before,.orn.white::after { background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); }
  .orn.white span { color:var(--yellow-lt); font-size:14px; }
  .orn.blue::before,.orn.blue::after { background:linear-gradient(90deg,transparent,var(--blue-lt),transparent); }
  .orn.blue span { color:var(--blue-mid); font-size:14px; }

  /* ═══════════════════════════════════
     HERO
  ═══════════════════════════════════ */
  .hero {
    background:linear-gradient(180deg, var(--green) 0%, #1A4D22 100%);
    padding:60px 24px; text-align:center; min-height:55vh;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-inner { max-width:600px; position:relative; z-index:2; }
  .hero-bismillah {
    font-family:'Playfair Display',serif; font-size:30px;
    color:var(--yellow-lt); margin-bottom:20px; letter-spacing:2px;
  }
  .hero-ayat">"Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu pasangan dari jenismu sendiri, supaya kamu cenderung dan merasa tenteram kepadanya."</p>

  <p class="hero-announce">Dengan memohon rahmat dan ridho Allah SWT, kami mengundang:</p>
  <p class="hero-guest" id="hero-guest"></p>
  <p class="hero-announce" style="margin-top:4px">untuk hadir di hari bahagia kami</p>
</div>
</section>

<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ════════════════════════════════════
RESY & AFIF – app.js
Fitur: Animasi kelopak, Countdown,
Musik, QR, RSVP, Wishes, Supabase
════════════════════════════════════ */

const SB_URL = 'https://bijessmsedrtfxbnieza.supabase.co';
const SB_KEY = 'sb_publishable_mmiBBx94Ri1-PjFQE6DyHQ_oElTvxJG';

const sb = {
h: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
async get(t) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${t}?select=*&order=created_at.desc`, { headers: sb.h });
    return r.ok ? await r.json() : null;
  } catch { return null; }
},
async post(t, d) {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/${t}`, {
      method: 'POST', headers: { ...sb.h, Prefer: 'return=representation' },
      body: JSON.stringify(d)
    });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}
};

// fallback data
const fallRsvp = [
{ name: 'Keluarga H. Dadan', count: 4, status: 'hadir', message: 'InsyaAllah hadir', created_at: new Date(Date.now()-86400000*2).toISOString() },
{ name: 'Ibu Siti Rahayu', count: 2, status: 'hadir', message: '', created_at: new Date(Date.now()-86400000).toISOString() },
];
const fallWishes = [
{ name: 'Keluarga Sonjaya', text: 'Selamat menempuh hidup baru! Semoga menjadi keluarga sakinah mawaddah warahmah. Barakallahu lakuma!', created_at: new Date(Date.now()-86400000*3).toISOString() },
{ name: 'Teh Rini & Kang Dedi', text: 'Semoga pernikahan kalian menjadi awal yang indah dan penuh keberkahan. Aamiin ya Rabbal Alamiin 🙏', created_at: new Date(Date.now()-86400000).toISOString() },
];

let musicOn = false;
let guestName = '';
let rsvpChoice = 'hadir';

// ── UTILS ──
function getParam(k) { return new URLSearchParams(location.search).get(k) || ''; }
function timeAgo(iso) {
const d = Math.floor((Date.now()-new Date(iso))/86400000);
const h = Math.floor((Date.now()-new Date(iso))/3600000);
const m = Math.floor((Date.now()-new Date(iso))/60000);
if (d>0) return `${d} hari lalu`;
if (h>0) return `${h} jam lalu`;
if (m>0) return `${m} menit lalu`;
return 'Baru saja';
}
function toast(msg) {
const t = document.getElementById('toast');
t.textContent = msg; t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2800);
}

// ── PETALS ANIMATION ──
function createPetals() {
const wrap = document.getElementById('petal-wrap');
const petalTypes = [
  { color: 'rgba(124,184,127,0.7)', w: 10, h: 14 },
  { color: 'rgba(200,150,10,0.7)',  w: 8,  h: 8  },
  { color: 'rgba(90,140,255,0.5)',  w: 9,  h: 12 },
  { color: 'rgba(180,230,180,0.6)', w: 12, h: 7  },
  { color: 'rgba(255,220,80,0.65)', w: 7,  h: 10 },
];
for (let i = 0; i < 28; i++) {
  const p = document.createElement('div');
  const type = petalTypes[i % petalTypes.length];
  const left = Math.random() * 100;
  const dur  = 6 + Math.random() * 8;
  const delay = Math.random() * 10;
  const drift = (Math.random() - 0.5) * 160;
  const spin  = (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 360);
  p.className = 'petal';
  p.style.cssText = `
    left:${left}%;
    width:${type.w}px; height:${type.h}px;
    background:${type.color};
    animation-duration:${dur}s;
    animation-delay:${delay}s;
    --drift:${drift}px;
    --spin:${spin}deg;
    border-radius:${Math.random()>0.5?'50% 10% 50% 10%':'30% 60% 30% 60%'};
  `;
  if(wrap) wrap.appendChild(p);
}
}

// ── OPEN INVITATION (DEPRECATED/BYPASSED) ──
function openInvitation() {
// Fungsi bypass langsung
}

// ── MUSIC ──
function tryPlay() {
const a = document.getElementById('bg-music');
if(a) {
  a.volume = 0.5;
  a.play().then(() => { musicOn = true; updMusicUI(); }).catch(() => {});
}
}
function toggleMusic() {
const a = document.getElementById('bg-music');
if(a) {
  musicOn ? a.pause() : a.play().then(() => {});
  musicOn = !musicOn;
  updMusicUI();
}
}
function updMusicUI() {
const p = document.getElementById('ico-play');
const pa = document.getElementById('ico-pause');
if(p && pa) {
  p.style.display  = musicOn ? 'none' : 'block';
  pa.style.display = musicOn ? 'block' : 'none';
}
}

// ── COUNTDOWN ──
function startCountdown() {
const target = new Date('2026-12-27T08:00:00+07:00');
function tick() {
  const diff = target - Date.now();
  if (diff <= 0) { ['cd-d','cd-h','cd-m','cd-s'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = '00'; }); return; }
  const pad = n => String(Math.floor(n)).padStart(2,'0');
  const cdD = document.getElementById('cd-d');
  const cdH = document.getElementById('cd-h');
  const cdM = document.getElementById('cd-m');
  const cdS = document.getElementById('cd-s');
  if(cdD) cdD.textContent = pad(diff/86400000);
  if(cdH) cdH.textContent = pad((diff%86400000)/3600000);
  if(cdM) cdM.textContent = pad((diff%3600000)/60000);
  if(cdS) cdS.textContent = pad((diff%60000)/1000);
}
tick(); setInterval(tick, 1000);
}

// ── SCROLL REVEAL ──
function initReveal() {
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      e.target.querySelectorAll('.reveal,.reveal-l,.reveal-r').forEach((el,i) => {
        setTimeout(() => el.classList.add('visible'), i * 120);
      });
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.reveal,.reveal-l,.reveal-r').forEach(el => obs.observe(el));
}

// ── QR CODE ──
function initQR(name) {
const c = document.getElementById('qr-container');
if(!c) return;
c.innerHTML = '';
const txt = name
  ? `WEDDING:RESY_AFIF|DATE:27122026|GUEST:${name}`
  : `WEDDING:RESY_AFIF|DATE:27122026`;
if (typeof QRCode !== 'undefined') {
  new QRCode(c, {
    text: txt, width: 176, height: 176,
    colorDark: '#2E6B35', colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.H
  });
}
const qnd = document.getElementById('qr-name-display');
if(qnd) qnd.textContent = name || 'Tamu Undangan';
}

// ── RSVP ──
function selOpt(el) {
document.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('sel'));
el.classList.add('sel');
document.getElementById('rsvp-choice').value = el.dataset.v;
rsvpChoice = el.dataset.v;
}

async function submitRsvp() {
const name = document.getElementById('rsvp-name').value.trim();
const count = parseInt(document.getElementById('rsvp-count').value) || 1;
const msg   = document.getElementById('rsvp-msg').value.trim();
const status = document.getElementById('rsvp-choice').value;
if (!name) { toast('⚠️ Mohon isi nama Anda'); return; }
const btn = document.querySelector('#sec-rsvp .btn-main');
btn.textContent = 'Mengirim...'; btn.disabled = true;
const rec = { name, count, status, message: msg };
const res = await sb.post('rsvp', rec);
fallRsvp.unshift({ ...rec, created_at: new Date().toISOString() });
toast(res ? '✅ Konfirmasi berhasil terkirim!' : '✅ Konfirmasi tercatat!');
document.getElementById('rsvp-name').value = '';
document.getElementById('rsvp-msg').value = '';
btn.textContent = 'Kirim Konfirmasi'; btn.disabled = false;
loadRsvp();
}

async function loadRsvp() {
const el = document.getElementById('rsvp-list');
if(!el) return;
const data = (await sb.get('rsvp')) || fallRsvp;
if (!data || !data.length) {
  el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-lt);font-style:italic">Belum ada konfirmasi.</div>';
  return;
}
el.innerHTML = data.map(r => `
  <div class="rsvp-item">
    <div>
      <div class="rsvp-name">${r.name}</div>
      <div class="rsvp-detail">${r.count} tamu · ${timeAgo(r.created_at)}${r.message ? ' · "'+r.message+'"' : ''}</div>
    </div>
    <span class="badge ${r.status==='hadir'?'bh':r.status==='tidak'?'bt':'br'}">
      ${r.status==='hadir'?'✓ Hadir':r.status==='tidak'?'✗ Tidak':'? Belum'}
    </span>
  </div>`).join('');
}

// ── WISHES ──
async function submitWish() {
const name = document.getElementById('wish-name').value.trim();
const text = document.getElementById('wish-text').value.trim();
if (!name || !text) { toast('⚠️ Mohon isi nama dan ucapan'); return; }
const btn = document.querySelector('#sec-wishes .btn-main');
btn.textContent = 'Mengirim...'; btn.disabled = true;
const rec = { name, text };
const res = await sb.post('wishes', rec);
fallWishes.unshift({ ...rec, created_at: new Date().toISOString() });
toast(res ? '✅ Ucapan terkirim! Terima kasih 🙏' : '✅ Ucapan tercatat!');
document.getElementById('wish-name').value = '';
document.getElementById('wish-text').value = '';
btn.textContent = 'Kirim Ucapan'; btn.disabled = false;
loadWishes();
}

async function loadWishes() {
const el = document.getElementById('wishes-list');
if(!el) return;
const data = (await sb.get('wishes')) || fallWishes;
if (!data || !data.length) {
  el.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);font-style:italic">Belum ada ucapan.</div>';
  return;
}
el.innerHTML = data.map(w => `
  <div class="wish-card">
    <div class="wish-name">${w.name}</div>
    <div class="wish-text">"${w.text}"</div>
    <div class="wish-time">${timeAgo(w.created_at)}</div>
  </div>`).join('');
}

// ── VIDEO YOUTUBE ──
function loadVideo(iframeId, inputId) {
const raw = document.getElementById(inputId).value.trim();
let vid = '';
const m = raw.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
if (m) vid = m[1];
if (!vid) { toast('⚠️ Link YouTube tidak valid'); return; }
const iframe = document.getElementById(iframeId);
const placeholder = document.getElementById(iframeId + '-placeholder');
if(iframe && placeholder) {
  iframe.src = `https://www.youtube.com/embed/${vid}?rel=0&modestbranding=1`;
  iframe.style.display = 'block';
  placeholder.style.display = 'none';
}
localStorage.setItem('yt_' + iframeId, vid);
}

function restoreVideos() {
['vid1'].forEach(id => {
  const saved = localStorage.getItem('yt_' + id);
  if (saved) {
    const iframe = document.getElementById(id);
    const ph = document.getElementById(id + '-placeholder');
    if (iframe && ph) {
      iframe.src = `https://www.youtube.com/embed/${saved}?rel=0&modestbranding=1`;
      iframe.style.display = 'block';
      ph.style.display = 'none';
    }
  }
});
}

// ── INIT MAIN ──
async function initMain() {
startCountdown();
initReveal();
restoreVideos();
await Promise.all([loadRsvp(), loadWishes()]);
initQR(guestName);
}

// ── BOOT ──
document.addEventListener('DOMContentLoaded', () => {
guestName = getParam('to');

// Langsung Tampilkan Main Content tanpa Cover
const cover = document.getElementById('cover');
const main = document.getElementById('main');
const player = document.getElementById('music-player');

if(cover) cover.style.display = 'none';
if(main) main.style.display = 'block';
if(player) player.style.display = 'flex';

createPetals();
initMain();
setTimeout(tryPlay, 600);

if (guestName) {
  const hn = document.getElementById('hero-guest');
  if (hn) hn.textContent = guestName;
  const ri = document.getElementById('rsvp-name');
  if (ri) ri.value = guestName;
} else {
  const hn = document.getElementById('hero-guest');
  if (hn) hn.textContent = 'Bapak/Ibu/Saudara/i';
}
});
</script>
